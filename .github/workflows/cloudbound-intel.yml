name: Cloudbound Intel (live + email)

# Refreshes the live competitive-intelligence feed (docs/intel/competitors_master.json),
# commits it so GitHub Pages / Vercel redeploy, and emails the digest.
# Default: every weekday at ~08:12 America/New_York (12:12 UTC). Editable below.
on:
  schedule:
    - cron: "12 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudbound-intel
  cancel-in-progress: false

jobs:
  intel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/fec-market-research-iid49i
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Refresh data + rebuild signals feed
        id: build
        env:
          MR_SEC_UA: ${{ vars.MR_SEC_UA }}
        run: |
          npx ts-node src/plugins/market-research/get.ts || echo "get had issues (continuing)"
          npx ts-node src/plugins/market-research/process.ts || echo "process had issues (continuing)"
          npx ts-node src/plugins/market-research/signals.ts

      - name: Commit refreshed feed
        run: |
          git config user.name "cloudbound-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/intel/data/signals/
          if git diff --staged --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore(intel): refresh signals feed [skip ci]"
            git push origin claude/fec-market-research-iid49i
          fi

      - name: Email the digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          INTEL_URL: ${{ vars.INTEL_URL }}
        run: node scripts/send-email.js connector_data/market-research/email.html
