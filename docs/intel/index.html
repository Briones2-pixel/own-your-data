<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloudbound · Competitive Intelligence (Live)</title>
<meta name="description" content="Live family-entertainment-center competitive intelligence — signals by type, scored and sourced." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet" />
<style>
  :root{--teal:#6ECAB8;--teal-dark:#3aaa8a;--lime:#C8F06A;--lime-dark:#7ab500;--peach:#F5C4A0;--sky:#A8D4F0;--black:#0F1218;--gray:#6B7280;--white:#fff;--cream:#F2EFE8;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--cream);font-family:'DM Sans',system-ui,sans-serif;color:var(--black);-webkit-font-smoothing:antialiased;line-height:1.45;}
  .wrap{max-width:1100px;margin:0 auto;padding:30px 22px 80px;}
  header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;border-bottom:1px solid rgba(15,18,24,.12);padding-bottom:18px;}
  .brand{font-family:'Playfair Display';font-weight:900;font-size:26px;}
  .brand .o{color:var(--teal-dark);}
  .brand .sub{display:block;font-family:'DM Sans';font-weight:400;font-size:12px;color:var(--gray);margin-top:2px;letter-spacing:.2px;}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(110,202,184,.18);border:1px solid rgba(110,202,184,.5);border-radius:100px;padding:6px 13px;font-weight:600;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal-dark);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal-dark);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;}
  .stat{background:var(--white);border:1px solid rgba(15,18,24,.1);border-radius:12px;padding:12px 18px;min-width:96px;}
  .stat .v{font-family:'Playfair Display';font-weight:700;font-size:26px;}
  .stat .l{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gray);font-weight:600;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 20px;}
  select,input{font-family:inherit;font-size:13px;padding:9px 12px;border:1px solid rgba(15,18,24,.18);border-radius:10px;background:var(--white);color:var(--black);}
  input{flex:1;min-width:200px;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
  @media(max-width:760px){.cols{grid-template-columns:1fr;}}
  .col h2{font-family:'Playfair Display';font-weight:700;font-size:15px;letter-spacing:.5px;text-transform:uppercase;color:var(--gray);border-bottom:1px solid rgba(15,18,24,.12);padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;}
  .card{padding:0 0 16px;border-bottom:1px solid rgba(15,18,24,.08);margin-bottom:16px;}
  .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;color:#fff;padding:3px 9px;border-radius:5px;vertical-align:middle;margin-right:6px;}
  .b-CAPITAL{background:#0F1218;}.b-EXPANSION{background:#3aaa8a;}.b-CONCEPT{background:#7a6cc4;}.b-DEMAND{background:#c2724a;}.b-TALENT{background:#3f7fb0;}.b-MARKETING{background:#b08900;}
  .hl{font-weight:600;font-size:14.5px;}
  .ent{font-size:12px;color:var(--gray);margin:6px 0;}
  .scores{font-size:12px;color:#3a3f48;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .scores b{color:var(--black);}
  .meter{display:inline-block;width:46px;height:6px;border-radius:3px;background:rgba(15,18,24,.1);overflow:hidden;vertical-align:middle;}
  .meter > i{display:block;height:100%;background:#c2724a;}
  .meter.med > i{background:var(--sky);}.meter.low > i{background:rgba(15,18,24,.2);}
  details{margin-top:8px;}summary{cursor:pointer;font-size:12px;color:var(--teal-dark);font-weight:600;}
  .act{font-size:12.5px;color:#23262d;margin-top:6px;background:rgba(110,202,184,.08);border-left:3px solid var(--teal);padding:8px 12px;border-radius:0 8px 8px 0;}
  .updated{font-size:12px;color:var(--gray);}
  footer{margin-top:36px;font-size:11.5px;color:var(--gray);border-top:1px solid rgba(15,18,24,.1);padding-top:14px;line-height:1.6;}
  .err{background:#fff;border:1px solid var(--peach);border-radius:12px;padding:16px;color:#a8743f;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="brand"><span class="b">Cloud</span><span class="o">bound</span> · Competitive Intelligence
      <span class="sub" id="sub">Organized by signal type — Concept · Demand · Capital · Expansion · Talent · Marketing</span></div></div>
    <div class="pill"><span class="dot"></span><span>Live · auto-refresh</span></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <select id="f-type"><option value="">All signal types</option></select>
    <select id="f-time"><option value="">Any time-sensitivity</option><option>high</option><option>medium</option><option>low</option></select>
    <input id="f-q" placeholder="Search company, keyword…" />
  </div>

  <div class="updated" id="updated"></div>
  <div id="board"><div class="err" style="display:none"></div></div>

  <footer id="foot">Cloudbound · Lava Island — FEC competitive intelligence. Auto-refreshed from <code>competitors_master.json</code>. Informational only — not investment advice.</footer>
</div>

<script>
const TYPES = ['CAPITAL','EXPANSION','CONCEPT','DEMAND','TALENT','MARKETING'];
const esc = (s)=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ALL = [];

const meter=(n,t)=>{const c=t==='high'?'':t==='medium'?'med':'low';return '<span class="meter '+c+'"><i style="width:'+(Math.max(0,Math.min(10,n))*10)+'%"></i></span>';};

function card(s){
  const sources=(s.sources&&s.sources.length)?'<details><summary>sources ('+s.sources.length+')</summary>'+s.sources.map(u=>'<div style="font-size:12px"><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a></div>').join('')+'</details>':'';
  const act=s.cloudboundAction?'<div class="act"><b>Cloudbound action:</b> '+esc(s.cloudboundAction)+'</div>':'';
  return '<div class="card"><div><span class="badge b-'+esc(s.type)+'">'+esc(s.type)+'</span><span class="hl">'+esc(s.company)+'</span></div>'+
    '<div class="ent">'+esc(s.headline)+'</div>'+
    '<div class="ent" style="color:#8a909a">'+esc(s.entities||'')+(s.week?' · '+esc(s.week):'')+'</div>'+
    '<div class="scores">Imp <b>'+esc(s.importance)+'</b> · Conf <b>'+esc(s.confidence)+'</b> · Impact <b>'+esc(s.impact)+'</b> · Time <b>'+esc(s.timeSensitivity)+'</b> '+meter(s.impact,s.timeSensitivity)+'</div>'+
    act+sources+'</div>';
}

function render(){
  const ft=document.getElementById('f-type').value, fs=document.getElementById('f-time').value, fq=document.getElementById('f-q').value.toLowerCase();
  const rows=ALL.filter(s=>(!ft||s.type===ft)&&(!fs||s.timeSensitivity===fs)&&(!fq||(s.company+' '+s.headline+' '+(s.entities||'')).toLowerCase().includes(fq)));
  const present=TYPES.filter(t=>rows.some(s=>s.type===t));
  document.getElementById('board').innerHTML='<div class="cols">'+
    present.map(t=>{const g=rows.filter(s=>s.type===t);return '<div class="col"><h2>'+t+' <span>'+g.length+'</span></h2>'+g.map(card).join('')+'</div>';}).join('')
    +'</div>'|| '<p>No signals match.</p>';
}

function statbar(){
  const counts={};ALL.forEach(s=>counts[s.type]=(counts[s.type]||0)+1);
  let html='<div class="stat"><div class="v">'+ALL.length+'</div><div class="l">Showing</div></div>';
  TYPES.forEach(t=>{if(counts[t])html+='<div class="stat"><div class="v">'+counts[t]+'</div><div class="l">'+t+'</div></div>';});
  document.getElementById('stats').innerHTML=html;
  const sel=document.getElementById('f-type');TYPES.forEach(t=>{if(counts[t]){const o=document.createElement('option');o.value=t;o.textContent=t+' ('+counts[t]+')';sel.appendChild(o);}});
}

async function load(){
  try{
    const r=await fetch('./competitors_master.json?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    ALL=(d.signals||[]).sort((a,b)=>(b.importance-a.importance)||(b.impact-a.impact));
    if(d.week)document.getElementById('sub').textContent='Week '+d.week+' · organized by signal type';
    if(d.generatedAt)document.getElementById('updated').textContent='Last updated '+new Date(d.generatedAt).toLocaleString()+' · refreshes every 5 min';
    statbar();render();
  }catch(e){
    document.getElementById('board').innerHTML='<div class="err">Couldn\'t load <code>competitors_master.json</code> ('+esc(e.message)+'). It publishes on the first scheduled refresh.</div>';
  }
}
['f-type','f-time','f-q'].forEach(id=>document.getElementById(id).addEventListener('input',render));
load();setInterval(load,5*60*1000);
</script>
</body>
</html>
